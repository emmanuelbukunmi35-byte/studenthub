<html lang="en">
<head>
<meta charset="UTF-8">

<title>StudentHub Quiz</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

h1 {
    text-align: center;
    color: #4f46e5;
}

select, button {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 16px;
}

button {
    background: #4f46e5;
    color: white;
    border: none;
    font-weight: bold;
}

.timer {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin: 15px;
}

.question {
    margin: 20px 0;
    padding: 15px;
    background: #f8fafc;
    border-radius: 12px;
}

.option {
    display: block;
    padding: 10px;
    margin: 7px 0;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.correct {
    background: #dcfce7 !important;
}

.wrong {
    background: #fee2e2 !important;
}

.correction {
    margin-top: 8px;
    padding: 10px;
    background: #eef2ff;
    border-radius: 8px;
    color: #3730a3;
}

#quizArea, #result {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 StudentHub Quiz</h1>

<div id="setup">

    <p>Select a subject:</p>

    <select id="subject">
        <option value="Physics">Physics</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Biology">Biology</option>
        <option value="English">English</option>
        <option value="Computer Science">Computer Science</option>
    </select>

    <button onclick="startQuiz()">Start Quiz</button>

</div>

<div id="quizArea">

    <div class="timer">
        ⏱️ Time: <span id="time">20:00</span>
    </div>

    <div id="questions"></div>

    <button onclick="submitQuiz()">Submit Quiz</button>

</div>

<div id="result"></div>

</div>

let currentQuestions = [];
let timer;
let timeLeft = 1200;

function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

function startQuiz() {

    const subject = document.getElementById("subject").value;

    currentQuestions = shuffle(questionBank[subject]);

    document.getElementById("setup").style.display = "none";
    document.getElementById("quizArea").style.display = "block";

    const box = document.getElementById("questions");
    box.innerHTML = "";

    currentQuestions.forEach((item, index) => {

        let html = `
        <div class="question">
            <h3>${index + 1}. ${item.q}</h3>
        `;

        item.a.forEach((answer, optionIndex) => {

            html += `
            <label class="option" id="option-${index}-${optionIndex}">
                <input type="radio" name="q${index}" value="${optionIndex}">
                ${answer}
            </label>
            `;

        });

        html += `<div id="correction-${index}"></div></div>`;

        box.innerHTML += html;
    });

    startTimer();
}

function startTimer() {

    timeLeft = 1200;

    clearInterval(timer);

    timer = setInterval(() => {

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;

        document.getElementById("time").textContent =
            `${minutes}:${seconds.toString().padStart(2, "0")}`;

        timeLeft--;

        if (timeLeft < 0) {
            clearInterval(timer);
            submitQuiz();
        }

    }, 1000);
}

function submitQuiz() {

    clearInterval(timer);

    let score = 0;

    currentQuestions.forEach((item, index) => {

        const selected =
            document.querySelector(`input[name="q${index}"]:checked`);

        const correction =
            document.getElementById(`correction-${index}`);

        if (selected) {

            const answer = Number(selected.value);

            if (answer === item.c) {

                score++;

                document
                .getElementById(`option-${index}-${answer}`)
                .classList.add("correct");

                correction.innerHTML =
                    `<div class="correction">✓ Correct!</div>`;

            } else {

                document
                .getElementById(`option-${index}-${answer}`)
                .classList.add("wrong");

                document
                .getElementById(`option-${index}-${item.c}`)
                .classList.add("correct");

                correction.innerHTML =
                    `<div class="correction">
                    Correct answer: <b>${item.a[item.c]}</b>
                    </div>`;
            }

        } else {

            document
            .getElementById(`option-${index}-${item.c}`)
            .classList.add("correct");

            correction.innerHTML =
                `<div class="correction">
                Not answered. Correct answer:
                <b>${item.a[item.c]}</b>
                </div>`;
        }

    });

    const subject = document.getElementById("subject").value;

    localStorage.setItem(
        "studenthub_last_quiz",
        JSON.stringify({
            subject: subject,
            score: score,
            total: currentQuestions.length,
            date: new Date().toLocaleString()
        })
    );

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML = `
        <h2>Quiz Finished!</h2>
        <h3>Your Score: ${score}/${currentQuestions.length}</h3>
        <p>Your corrections are shown above.</p>
        <button onclick="location.reload()">Take Another Quiz</button>
    `;

    document.getElementById("result").scrollIntoView({
        behavior: "smooth"
    });
}

</script>
