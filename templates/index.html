<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudentHub</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#222}
header{background:#2563eb;color:white;padding:25px;text-align:center}
.container{max-width:800px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 3px 10px #ddd}
a{display:block;background:#2563eb;color:white;padding:14px;border-radius:10px;text-decoration:none;text-align:center;margin-top:10px}
</style>
</head>
<body>
<header><h1>🎓 StudentHub</h1><p>Your all-in-one student platform</p></header>
<div class="container">
<div class="card"><h2>🤖 StudyBot</h2><p>Ask questions and learn.</p><a href="/studybot">Open StudyBot</a></div>
<div class="card"><h2>📝 Quizzes</h2><p>Practice your subjects.</p><a href="/quiz">Open Quizzes</a></div>
<div class="card"><h2>📚 Notes</h2><p>Keep your study notes.</p><a href="/notes">Open Notes</a></div>
<div class="card"><h2>📊 Progress</h2><p>View your study progress.</p><a href="/progress">View Progress</a></div>
<div class="card"><h2>⏱️ Study Timer</h2><p>Focus while studying.</p><a href="/timer">Open Timer</a></div>
</div>
</body>
</html>
